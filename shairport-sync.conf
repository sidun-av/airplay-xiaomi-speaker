// shairport-sync config for airplay-xiaomi-speaker (AirPlay 2 image).
// Audio goes into a FIFO read by the streamer; session and volume events are
// forwarded to the streamer's hooks on 127.0.0.1:8095 (both containers use
// the host network). If you change PORT for the streamer, change it here too.
general =
{
	// The name shown in the AirPlay menu on iPhone/Mac.
	name = "Xiaomi Speaker";
	output_backend = "pipe";
	// Keep the PCM at full scale; the AirPlay volume slider is forwarded to
	// the speaker's own volume instead (see VOLUME_SYNC).
	ignore_volume_control = "yes";
	// The speaker buffers ~4-5 s of the stream before it plays. AirPlay 2
	// senders deliver audio seconds ahead of its play time, so hand it to the
	// speaker early to win some of that back (and to stay closer to other
	// speakers in a multi-room group). More negative = less delay, until the
	// start of each track gets clipped. For the AirPlay 1 ("classic") image,
	// whose buffer is only ~2 s, remove these two lines.
	audio_backend_latency_offset_in_seconds = -3.0;
	audio_decoded_buffer_desired_length_in_seconds = 5.0;
	// shairport-sync appends the volume as an extra argument, which a plain
	// wget URL can't take, so a tiny script forwards it (mounted by compose).
	run_this_when_volume_is_set = "/bin/sh /hooks/volume.sh ";
};

sessioncontrol =
{
	run_this_before_play_begins = "/usr/bin/wget -q -O /dev/null http://127.0.0.1:8095/hook/start";
	run_this_after_play_ends = "/usr/bin/wget -q -O /dev/null http://127.0.0.1:8095/hook/stop";
	wait_for_completion = "no";
	allow_session_interruption = "yes";
};

pipe =
{
	// Must match FIFO in the streamer; the directory is a shared volume.
	name = "/pipe/audio";
	// The streamer reads 16-bit 44.1 kHz stereo. These are the defaults for
	// AirPlay 1, but the AirPlay 2 build writes S32_LE at 48 kHz unless told
	// otherwise, which the streamer would turn into loud white noise.
	output_rate = 44100;
	output_format = "S16_LE";
	output_channels = 2;
};
